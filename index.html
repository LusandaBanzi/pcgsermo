<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Women's Month Welcome Screen</title>

<style>

/* =========================
   RESET
========================= */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}


/* =========================
   WOMEN'S MONTH BACKGROUND
   Purple • Pink • Rose • Gold
========================= */
body{
    font-family:Arial, Helvetica, sans-serif;
    position:relative;
    color:#fff;

    background:
        linear-gradient(
            -45deg,
            #2b0b3f,
            #4a124f,
            #701f62,
            #a52a6b,
            #d85b91,
            #f48fb1,
            #c27ba0,
            #7d3c75,
            #3b0a45
        );

    background-size:500% 500%;
    animation:gradientShift 25s ease infinite;
}

@keyframes gradientShift{
    0%{
        background-position:0% 50%;
    }

    50%{
        background-position:100% 50%;
    }

    100%{
        background-position:0% 50%;
    }
}


/* =========================
   SOFT LIGHT OVERLAY
========================= */
body::before{
    content:"";
    position:absolute;
    inset:0;

    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(255,255,255,.13),
            transparent 30%
        ),

        radial-gradient(
            circle at 80% 75%,
            rgba(255,192,203,.18),
            transparent 35%
        );

    z-index:0;
    pointer-events:none;
}


/* =========================
   BACKGROUND SCROLLING BAND
========================= */
.bg-scroll{
    position:absolute;
    top:50%;
    left:0;
    transform:translateY(-50%);
    width:100%;
    overflow:hidden;
    z-index:1;
    pointer-events:none;
}

.bg-scroll-track{
    display:flex;
    width:max-content;
    animation:bgScroll 220s linear infinite;
}

.bg-scroll-track span{
    font-size:28vw;
    font-weight:900;

    color:transparent;

    -webkit-text-stroke:
        2px white;

    text-stroke:
        2px rgba(255,182,193,0.18);

    white-space:nowrap;
    padding-right:6vw;
    line-height:1;
    text-transform:uppercase;
}

@keyframes bgScroll{
    from{
        transform:translateX(0);
    }

    to{
        transform:translateX(-50%);
    }
}


/* =========================
   HEADER
========================= */
.header{
    position:absolute;
    top:2vh;
    left:2vw;

    display:flex;
    align-items:center;

    gap:1.2vw;

    z-index:30;

    max-width:80vw;
}


/* =========================
   FLOWER FRAME AROUND LOGO
========================= */
.logo-frame{
    position:relative;

    width:175px;
    height:140px;

    display:flex;
    align-items:center;
    justify-content:center;

    flex-shrink:0;
}


/* Soft glow behind logo */
.logo-frame::before{
    content:"";

    position:absolute;

    width:120px;
    height:120px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.9),
            rgba(255,182,193,.45),
            rgba(219,112,147,.18),
            transparent 72%
        );

    box-shadow:
        0 0 20px rgba(255,182,193,.8),
        0 0 45px rgba(255,105,180,.5);

    animation:logoGlow 4s ease-in-out infinite;

    z-index:1;
}


.logo{
    width:145px;
    height:110px;

    object-fit:contain;

    position:relative;
    z-index:10;

    filter:
        drop-shadow(0 0 8px rgba(255,255,255,.8))
        drop-shadow(0 0 18px rgba(255,105,180,.6));

    animation:logoFloat 5s ease-in-out infinite;
}


/* Logo movement */
@keyframes logoFloat{
    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-6px);
    }
}


/* Logo glow */
@keyframes logoGlow{
    0%,100%{
        transform:scale(1);
        opacity:.7;
    }

    50%{
        transform:scale(1.14);
        opacity:1;
    }
}


/* =========================
   FLOWERS AROUND THE LOGO
========================= */
.logo-flower{
    position:absolute;

    z-index:20;

    font-size:36px;

    filter:
        drop-shadow(0 0 5px rgba(255,255,255,.9))
        drop-shadow(0 0 12px rgba(255,105,180,.7));

    animation:
        flowerFloat 4s ease-in-out infinite,
        flowerRotate 10s linear infinite;
}


.flower1{
    top:-8px;
    left:8px;
}


.flower2{
    top:-10px;
    right:5px;

    animation-delay:-2s;
}


.flower3{
    bottom:-5px;
    left:5px;

    animation-delay:-4s;
}


.flower4{
    bottom:-6px;
    right:4px;

    animation-delay:-1s;
}


.flower5{
    left:-13px;
    top:43%;

    font-size:31px;

    animation-delay:-3s;
}


.flower6{
    right:-13px;
    top:43%;

    font-size:31px;

    animation-delay:-5s;
}


/* Flowers gently float */
@keyframes flowerFloat{
    0%,100%{
        transform:translateY(0) scale(1);
    }

    50%{
        transform:translateY(-9px) scale(1.12);
    }
}


/* Flowers slowly rotate */
@keyframes flowerRotate{
    from{
        rotate:0deg;
    }

    to{
        rotate:360deg;
    }
}


/* =========================
   FLOATING PETALS
========================= */
.petal{
    position:absolute;

    width:9px;
    height:15px;

    background:
        linear-gradient(
            135deg,
            #ffffff,
            #ffc0cb,
            #ff69b4
        );

    border-radius:
        80% 20%
        80% 20%;

    z-index:15;

    box-shadow:
        0 0 8px rgba(255,255,255,.8);

    animation:petalMove 6s ease-in-out infinite;
}


.petal1{
    top:8px;
    left:45px;
}


.petal2{
    top:10px;
    right:40px;

    animation-delay:-2s;
}


.petal3{
    bottom:8px;
    left:42px;

    animation-delay:-4s;
}


.petal4{
    bottom:8px;
    right:40px;

    animation-delay:-1s;
}


@keyframes petalMove{
    0%,100%{
        transform:
            translate(0,0)
            rotate(0deg);
    }

    50%{
        transform:
            translate(12px,-10px)
            rotate(180deg);
    }
}


/* =========================
   CHURCH NAME
========================= */
.church-name{
    font-size:3.5vw;
    font-weight:1000;

    letter-spacing:2px;

    text-transform:uppercase;

    line-height:1.2;

    background:
        linear-gradient(
            90deg,
            #ffffff,
            #ffd1dc,
            #ffb6c1,
            #ffd700,
            #fff0f5,
            #ffffff
        );

    background-size:300% 100%;

    -webkit-background-clip:text;
    background-clip:text;

    -webkit-text-fill-color:transparent;

    animation:churchShine 10s linear infinite;

    filter:
        drop-shadow(0 0 10px rgba(255,105,180,.6));
}


@keyframes churchShine{
    from{
        background-position:0% 50%;
    }

    to{
        background-position:300% 50%;
    }
}


@keyframes labelFloat{
    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-7px);
    }
}


/* =========================
   CENTER WELCOME
========================= */
.center-wrap{
    position:absolute;

    top:52%;
    left:50%;

    transform:translate(-50%,-50%);

    z-index:10;

    text-align:center;

    width:100%;
}


.main-text{
    position:relative;

    font-size:19.5vw;
    font-weight:900;

    text-transform:uppercase;

    line-height:1;

    z-index:10;

    background:
        linear-gradient(
            90deg,
            #ffffff,
            #ffd1dc,
            #ff69b4,
            #f8bbd0,
            #ffd700,
            #fff0f5,
            #ff69b4,
            #ffffff
        );

    background-size:400% 100%;

    -webkit-background-clip:text;
    background-clip:text;

    -webkit-text-fill-color:transparent;

    animation:
        pulse 4s ease-in-out infinite,
        hue 12s linear infinite;

    filter:
        drop-shadow(0 0 25px rgba(255,105,180,.65))
        drop-shadow(0 0 45px rgba(255,182,193,.3));
}


@keyframes pulse{
    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.04);
    }
}


@keyframes hue{
    from{
        background-position:0% 50%;
    }

    to{
        background-position:400% 50%;
    }
}


/* =========================
   FLOATING FLOWERS
========================= */
.floating-flower{
    position:absolute;

    z-index:4;

    font-size:3vw;

    opacity:.65;

    filter:
        drop-shadow(0 0 8px rgba(255,255,255,.5));

    animation:
        bigFlowerFloat 11s ease-in-out infinite,
        bigFlowerRotate 18s linear infinite;
}


.ff1{
    top:30%;
    left:7%;
}


.ff2{
    bottom:18%;
    right:7%;

    animation-delay:-3s;
}


.ff3{
    top:35%;
    right:8%;

    font-size:4vw;

    animation-delay:-6s;
}


.ff4{
    bottom:18%;
    left:12%;

    animation-delay:-2s;
}


@keyframes bigFlowerFloat{
    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-30px);
    }
}


@keyframes bigFlowerRotate{
    from{
        rotate:0deg;
    }

    to{
        rotate:360deg;
    }
}


/* =========================
   FLOATING SHAPES
========================= */
.shape{
    position:absolute;
    border-radius:50%;

    filter:blur(6px);

    opacity:.55;

    z-index:2;

    mix-blend-mode:screen;
}


.s1{
    width:14vw;
    height:14vw;

    background:
        radial-gradient(
            circle,
            #ff69b4,
            transparent 70%
        );

    top:18%;
    left:15%;

    animation:float1 14s ease-in-out infinite;
}


.s2{
    width:20vw;
    height:20vw;

    background:
        radial-gradient(
            circle,
            #ffd1dc,
            transparent 70%
        );

    bottom:15%;
    right:12%;

    animation:float2 18s ease-in-out infinite;
}


.s3{
    width:11vw;
    height:11vw;

    background:
        radial-gradient(
            circle,
            #ba68c8,
            transparent 70%
        );

    top:28%;
    right:22%;

    animation:float3 12s ease-in-out infinite;
}


.s4{
    width:16vw;
    height:16vw;

    background:
        radial-gradient(
            circle,
            #ffd700,
            transparent 70%
        );

    bottom:22%;
    left:10%;

    animation:float2 20s ease-in-out infinite reverse;
}


@keyframes float1{
    0%,100%{
        transform:translateY(0) rotate(0deg);
    }

    50%{
        transform:translateY(-4vh) rotate(180deg);
    }
}


@keyframes float2{
    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(5vh);
    }
}


@keyframes float3{
    0%,100%{
        transform:translateX(0);
    }

    50%{
        transform:translateX(-5vw);
    }
}


/* =========================
   FOOTER
========================= */
.footer{
    position:absolute;

    bottom:3vh;

    width:100%;

    text-align:center;

    font-size:2.5vw;

    font-weight:600;

    letter-spacing:2px;

    color:#fff0f5;

    z-index:20;

    text-shadow:
        0 0 15px rgba(255,105,180,.8),
        0 0 25px rgba(255,182,193,.4);
}


/* =========================
   CENTRE GLOW
========================= */
.glow{
    position:absolute;

    width:60vw;
    height:60vw;

    max-width:900px;
    max-height:900px;

    background:
        radial-gradient(
            circle,
            rgba(255,105,180,.35),
            rgba(255,182,193,.25),
            rgba(186,85,211,.15),
            rgba(255,215,0,.08),
            transparent 70%
        );

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    z-index:0;

    animation:glowPulse 8s ease-in-out infinite;
}


@keyframes glowPulse{
    0%,100%{
        opacity:.7;
        transform:translate(-50%,-50%) scale(1);
    }

    50%{
        opacity:1;
        transform:translate(-50%,-50%) scale(1.15);
    }
}

</style>
</head>

<body>


<!-- Centre Glow -->
<div class="glow"></div>


<!-- Background Scrolling WELCOME -->
<div class="bg-scroll">

    <div class="bg-scroll-track">

        <span>
            SERMON&nbsp;&nbsp;
            SERMON&nbsp;&nbsp;
            SERMON&nbsp;&nbsp;
            SERMON&nbsp;&nbsp;
            SERMON&nbsp;&nbsp;
            SERMON&nbsp;&nbsp;
        </span>

        <span>
            SERMON&nbsp;&nbsp;
            SERMON&nbsp;&nbsp;
            SERMON&nbsp;&nbsp;
            SERMON&nbsp;&nbsp;
            SERMON&nbsp;&nbsp;
            SERMON&nbsp;&nbsp;
        </span>

    </div>

</div>


<!-- Header -->
<div class="header">


    <!-- Animated Flower Frame -->
    <div class="logo-frame">


        <img
            src="pcglogo.png"
            class="logo"
            alt="Church Logo"
            onerror="this.style.display='none'"
        >


        <!-- Flowers -->
        <span class="logo-flower flower1">🌸</span>
        <span class="logo-flower flower2">🌺</span>
        <span class="logo-flower flower3">🌷</span>
        <span class="logo-flower flower4">🌹</span>
        <span class="logo-flower flower5">🌼</span>
        <span class="logo-flower flower6">🌸</span>


        <!-- Petals -->
        <span class="petal petal1"></span>
        <span class="petal petal2"></span>
        <span class="petal petal3"></span>
        <span class="petal petal4"></span>


    </div>


    <div class="church-name">
        THE PENTECOSTAL CHURCH OF GOD
    </div>


</div>


<!-- Floating Background Flowers -->
<div class="floating-flower ff1">🌸</div>
<div class="floating-flower ff2">🌺</div>
<div class="floating-flower ff3">🌷</div>
<div class="floating-flower ff4">🌹</div>


<!-- Center Welcome -->
<div class="center-wrap">

    <div class="main-text">
        SERMON
    </div>

</div>


<!-- Floating Colour Shapes -->
<div class="shape s1"></div>
<div class="shape s2"></div>
<div class="shape s3"></div>
<div class="shape s4"></div>


<!-- Footer -->
<div class="footer">
    We exist to be heavenly bound, edify the church and evangelize the world.
</div>


<script>

/* Soft blur breathing on floating shapes */
const shapes = document.querySelectorAll('.shape');

setInterval(() => {

    shapes.forEach(shape => {

        shape.style.filter =
            `blur(${4 + Math.random() * 6}px)`;

    });

}, 2500);

</script>


</body>
</html>
